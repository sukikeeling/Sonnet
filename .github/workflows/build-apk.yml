name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "ci/build-apk" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build with Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          mkdir -p www/css www/js
          cp css/style.css www/css/
          cp js/app.js www/js/
          npm init -y
          npm install @capacitor/cli @capacitor/core @capacitor/android
          npx cap init "Sonnet" "com.sonnet.app" --web-dir ./www
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -100

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sonnet-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn