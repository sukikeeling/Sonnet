name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "ci/build-apk" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor
        run: npm install -g @capacitor/cli @capacitor/core @capacitor/android

      - name: Create project
        run: |
          mkdir -p app/www
          cp index.html app/www/
          mkdir -p app/www/css app/www/js
          cp css/style.css app/www/css/
          cp js/app.js app/www/js/
          cd app
          npm init -y
          npm install @capacitor/cli @capacitor/core @capacitor/android
          npx cap init "十四行诗" "com.sonnet.app" --web-dir ./www
          npx cap add android

      - name: Build release APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 | tail -100

      - name: Find and upload APK
        run: |
          echo "Searching for APKs..."
          find . -name "*.apk" -type f 2>/dev/null || true
          mkdir -p apk-out
          find . -name "*.apk" -type f -exec cp {} apk-out/ \; 2>/dev/null || true
          ls -la apk-out/ || echo "No APK found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sonnet-apk
          path: apk-out/