name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "ci/build-apk" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          ndk: false

      - name: Install pwabuilder
        run: npm install -g @pwabuilder/cli

      - name: Generate APK with pwabuilder
        run: |
          npx pwabuilder package --platform android --project . --output ./apk-output 2>&1 || true
          ls -la ./apk-output/ 2>/dev/null || echo "No pwabuilder output"

      - name: Alternative - use bubblewrap
        if: failure()
        run: |
          npm install -g @bubblewrap/cli
          npx bubblewrap init --manifest "" --directory ./apk-output 2>&1 || true
          ls -la ./apk-output/ 2>/dev/null || echo "No bubblewrap output"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sonnet-apk
          path: apk-output/
          if-no-files-found: warn