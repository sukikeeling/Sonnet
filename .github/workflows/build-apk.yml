name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "ci/build-apk" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create Capacitor project
        run: |
          mkdir -p build-app/www
          cp index.html build-app/www/
          mkdir -p build-app/www/css build-app/www/js
          cp css/style.css build-app/www/css/
          cp js/app.js build-app/www/js/
          cd build-app
          npm init -y
          npm install @capacitor/cli @capacitor/core @capacitor/android
          npx cap init "十四行诗" "com.sonnet.app" --web-dir ./www
          npx cap add android

      - name: Build APK
        run: |
          cd build-app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate and upload APK
        run: |
          find build-app -name "*.apk" -type f
          ls -la build-app/android/app/build/outputs/apk/debug/ 2>/dev/null || echo "No debug APK dir"
          mkdir -p apk-output
          cp build-app/android/app/build/outputs/apk/debug/*.apk apk-output/ 2>/dev/null || echo "No APK found at expected path"
          # Try alternate paths
          find build-app -name "*.apk" -exec cp {} apk-output/ \; 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sonnet-apk
          path: apk-output/