name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "ci/build-apk" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: |
          mkdir -p www
          cp index.html www/
          mkdir -p www/css www/js
          cp css/style.css www/css/
          cp js/app.js www/js/
          npm init -y
          npm install @capacitor/cli @capacitor/core @capacitor/android
          npx cap init "Sonnet" "com.sonnet.app" --web-dir ./www
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1

      - name: Find APK
        run: |
          find . -name "*.apk" -type f 2>/dev/null || echo "NOT FOUND"
          ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || echo "NO DEBUG DIR"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sonnet-apk
          path: "*.apk"
          if-no-files-found: error